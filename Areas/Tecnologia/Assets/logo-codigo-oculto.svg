<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Gradiente dourado (misterioso/riqueza) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="50%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <!-- Gradiente roxo (mistério/esotérico) -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2b0a4a"/>
    </linearGradient>
    <!-- Gradiente do olho -->
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <!-- Brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro misterioso -->
  <rect width="800" height="800" fill="url(#purple)"/>

  <!-- Anel externo dourado (ciclo/conhecimento) -->
  <circle cx="400" cy="400" r="375" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.4"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>

  <!-- Linhas de código/binário decorativas ao redor -->
  <g fill="#f5d76e" opacity="0.5" font-family="monospace" font-size="18">
    <text x="80" y="180">01001101</text>
    <text x="620" y="150">10110110</text>
    <text x="620" y="660">01100101</text>
    <text x="90" y="640">11010010</text>
  </g>

  <!-- Triângulo (símbolo oculto/código secreto) -->
  <polygon points="400,140 680,620 120,620" fill="rgba(245,215,110,0.08)" stroke="url(#gold)" stroke-width="4" filter="url(#glow)"/>

  <!-- Olho dentro do triângulo (conhecimento/vigilância/mente) -->
  <!-- Globular -->
  <ellipse cx="400" cy="420" rx="105" ry="62" fill="url(#eye)"/>
  <!-- Pupila -->
  <circle cx="400" cy="420" r="28" fill="#0a0a0a"/>
  <circle cx="400" cy="410" r="9" fill="#ffffff" opacity="0.9"/>
  <!-- Contorno do olho -->
  <ellipse cx="400" cy="420" rx="105" ry="62" fill="none" stroke="#f5d76e" stroke-width="3"/>

  <!-- Raios de luz do triângulo -->
  <g stroke="url(#gold)" stroke-width="2" opacity="0.6">
    <line x1="400" y1="140" x2="400" y2="60"/>
    <line x1="400" y1="680" x2="400" y2="740"/>
    <line x1="200" y1="205" x2="145" y2="150"/>
    <line x1="600" y1="205" x2="655" y2="150"/>
  </g>

  <!-- Círculo de estrelas/código interno -->
  <g fill="#f5d76e" opacity="0.8">
    <circle cx="400" cy="200" r="4"/>
    <circle cx="470" cy="225" r="3"/>
    <circle cx="330" cy="225" r="3"/>
    <circle cx="540" cy="330" r="3"/>
    <circle cx="260" cy="330" r="3"/>
  </g>

  <!-- Nome do canal -->
  <text x="400" y="745" fill="url(#gold)" font-family="serif" font-size="62" font-weight="bold" text-anchor="middle" letter-spacing="6">O CÓDIGO OCULTO</text>
  <line x1="180" y1="765" x2="620" y2="765" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
</svg>
